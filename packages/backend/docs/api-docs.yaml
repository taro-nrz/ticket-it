openapi: 3.1.1
info:
  title: API de AI Ticket It
  version: 1.0.0
  description: |-
    API REST de la plataforma de venta de entradas **AI Ticket It** (TP de Desarrollo de Software, UTN FRBA).

    **Cómo probar**
    1. Ejecutá `POST /auth/login` con un usuario de prueba y copiá el `token` de la respuesta.
    2. Hacé clic en **Authorize** y pegá el token (sin escribir "Bearer").
    3. Usuarios de prueba (datos semilla), todos con la contraseña `ticketit123`:
       - `lucia@ticketit.com` (id 1) Lucía Fernández — ORGANIZADOR (eventos 1, 3, 6, 7, 9)
       - `martin@ticketit.com` (id 2) Martín Gómez — ORGANIZADOR (eventos 2, 4, 5, 8)
       - `sofia@ticketit.com` (id 3) Sofía Pérez — COMPRADOR (compras 1 a 5)
       - `juan@ticketit.com` (id 4) Juan Rodríguez — COMPRADOR (compras 6 a 9; la 6 está UTILIZADA y sin reseñar)
       - `valentina@ticketit.com` (id 5) Valentina López — COMPRADOR (compras 10 a 13)
    4. `POST /dev/reset` vuelve a cargar los datos semilla.

    **Convenciones**
    - Persistencia en memoria: los datos se reinician al reiniciar el servidor.
    - Fechas en ISO 8601. Listados paginados con `page` y `limit` (máx. 100).
    - Errores con formato `{ status, message, errores? }`.
    - Estados de una compra: `PENDIENTE → CONFIRMADA → UTILIZADA`; cancelar lleva a `CANCELADA`
      (y a `REEMBOLSADA` automáticamente si estaba pagada).
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Sistema
  - name: Autenticación
    description: Registro, inicio de sesión y usuario actual con JWT (M9 — D-29)
  - name: Usuarios
    description: Usuarios y favoritos (M1)
  - name: Categorías
    description: Categorías de eventos (M1)
  - name: Eventos
    description: Publicación, búsqueda y detalle de eventos (M2 — HU-01, HU-02, HU-03)
  - name: Compras
    description: Compra de entradas y consulta (M3 — HU-04, HU-05, HU-06)
  - name: Ciclo de vida de la compra
    description: Pagar, utilizar, cancelar e historial (M4 — HU-09, HU-10)
  - name: Mensajes
    description: Chat de la compra (M5 — HU-07, HU-08)
  - name: Cupones
    description: Cupones de descuento por evento (M17 — D-38)
  - name: Lista de espera
    description: Anotarse a un tipo de entrada agotado (M19 — D-40)
  - name: Archivos
    description: Subida de imágenes de eventos (M21 — D-42)
  - name: Notificaciones
    description: Avisos dentro de la app (M12 — D-32)
  - name: Reseñas
    description: Reseñas y reputación del organizador (M6 — HU-11, HU-12)
  - name: Desarrollo

components:
  securitySchemes:
    usuario:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token que devuelven `POST /auth/login` y `POST /auth/registro` (vence a las 8 horas).

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    EventoId:
      in: path
      name: eventoId
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
      description: Número de página (1-indexado)
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      description: Elementos por página
    EstadoCompra:
      in: query
      name: estado
      schema: { $ref: "#/components/schemas/EstadoCompra" }
      description: Filtra por estado de la compra

  responses:
    BadRequest:
      description: Datos de validación inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: fail
            message: Datos de validación inválidos
            errores:
              - campo: cantidad
                mensaje: Demasiado pequeño, se esperaba que el número fuera >0
    Unauthorized:
      description: Falta el token, es inválido o venció
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: fail, message: Tenés que iniciar sesión para realizar esta acción }
    TooManyRequests:
      description: Demasiados intentos de inicio de sesión desde la misma IP
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: fail, message: Demasiados intentos. Probá de nuevo en unos minutos }
    Forbidden:
      description: El usuario no tiene permisos para la acción (rol o pertenencia)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: fail, message: Esta acción es sólo para usuarios con rol COMPRADOR }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: fail, message: No existe el evento con id 99 }
    Conflict:
      description: Conflicto con un recurso existente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BusinessRule:
      description: La operación viola una regla de negocio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { status: fail, message: No se puede pasar una compra de UTILIZADA a CANCELADA }

  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [fail, error] }
        message: { type: string }
        errores:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

    Paginado:
      type: object
      properties:
        pagina: { type: integer, example: 1 }
        perPage: { type: integer, example: 10 }
        total: { type: integer, example: 6 }
        totalPaginas: { type: integer, example: 1 }

    RolUsuario:
      type: string
      enum: [COMPRADOR, ORGANIZADOR]

    EstadoCompra:
      type: string
      enum: [PENDIENTE, CONFIRMADA, UTILIZADA, CANCELADA, REEMBOLSADA, VENCIDA]

    AccionCompra:
      type: string
      enum: [PAGAR, CANCELAR, UTILIZAR, RESENIAR, CHATEAR]

    UsuarioResumen:
      type: object
      properties:
        id: { type: integer, example: 3 }
        nombre: { type: string, example: Sofía }
        apellido: { type: string, example: Pérez }
        rol: { $ref: "#/components/schemas/RolUsuario" }

    Usuario:
      allOf:
        - $ref: "#/components/schemas/UsuarioResumen"
        - type: object
          properties:
            cantidadFavoritos:
              type: integer
              description: Sólo para compradores
              example: 2

    UsuarioPropio:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          properties:
            email: { type: string, format: email, example: sofia@ticketit.com }

    Sesion:
      type: object
      properties:
        token: { type: string, description: JWT para el header Authorization }
        usuario: { $ref: "#/components/schemas/UsuarioPropio" }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: sofia@ticketit.com }
        password: { type: string, example: ticketit123 }

    RegistroInput:
      type: object
      required: [nombre, apellido, email, password, rol]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 50, example: Ana }
        apellido: { type: string, minLength: 2, maxLength: 50, example: Suárez }
        email: { type: string, format: email, example: ana@mail.com }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Al menos una letra y un número
          example: secreta123
        rol: { type: string, enum: [COMPRADOR, ORGANIZADOR] }

    Cupon:
      type: object
      properties:
        id: { type: integer, example: 1 }
        codigo: { type: string, example: INDIE20 }
        tipo: { type: string, enum: [PORCENTAJE, MONTO_FIJO, DOS_POR_UNO] }
        descripcion: { type: string, example: 20% de descuento }
        porcentaje: { type: [integer, "null"], example: 20 }
        monto: { type: [number, "null"] }
        usos: { type: integer, example: 0 }
        usosMaximos: { type: [integer, "null"], description: null = sin límite }
        usosRestantes: { type: [integer, "null"] }
        vence: { type: [string, "null"], format: date-time }
        activo: { type: boolean }
        disponible: { type: boolean, description: Activo, no vencido y con usos disponibles }

    CuponInput:
      type: object
      required: [tipo, codigo]
      description: Según el tipo se envía `porcentaje` (1–100) o `monto` (> 0); el 2×1 no lleva valor.
      properties:
        tipo: { type: string, enum: [PORCENTAJE, MONTO_FIJO, DOS_POR_UNO] }
        codigo: { type: string, pattern: "^[A-Za-z0-9]{3,20}$", example: PROMO500 }
        porcentaje: { type: integer, minimum: 1, maximum: 100 }
        monto: { type: number, example: 500 }
        usosMaximos: { type: [integer, "null"], example: 100 }
        vence: { type: [string, "null"], format: date-time }

    InscripcionEspera:
      type: object
      properties:
        id: { type: integer }
        tipoEntradaId: { type: integer, example: 2 }
        tipoEntrada: { type: string, example: Platea }
        cantidad: { type: integer, example: 1 }
        estado: { type: string, enum: [ESPERANDO, AVISADA, CONVERTIDA, EXPIRADA, RETIRADA] }
        fecha: { type: string, format: date-time }
        prioridadHasta:
          type: [string, "null"]
          format: date-time
          description: Si está AVISADA, hasta cuándo tiene las entradas guardadas (30 min)
        posicion: { type: [integer, "null"], description: Puesto en la cola si está ESPERANDO }

    Notificacion:
      type: object
      properties:
        id: { type: integer, example: 2 }
        tipo:
          type: string
          enum:
            [
              NUEVA_VENTA,
              COMPRA_CANCELADA,
              NUEVO_MENSAJE,
              ENTRADA_UTILIZADA,
              EVENTO_CANCELADO,
              NUEVA_RESENIA,
              RESERVA_VENCIDA,
              LUGAR_DISPONIBLE,
              PRIORIDAD_VENCIDA,
              ENTRADA_RECIBIDA,
            ]
        titulo: { type: string, example: Mensaje de Sofía Pérez }
        mensaje: { type: string, example: "Noche Indie en Obras: “Genial, ¡gracias!”" }
        link: { type: string, description: Ruta de la app a la que lleva, example: /compra/1/chat }
        fecha: { type: string, format: date-time }
        estado: { type: string, enum: [NO_LEIDA, LEIDA] }
        cantidad:
          type: integer
          description: Cuántos avisos iguales sin leer se agruparon (ej. varios mensajes del mismo chat)
          example: 1

    Categoria:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Recitales }
        descripcion: { type: string, example: Shows en vivo de bandas y solistas }

    Organizador:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Lucía }
        apellido: { type: string, example: Fernández }
        puntajePromedio:
          type: [number, "null"]
          description: Promedio de las reseñas de sus eventos (null si no tiene)
          example: 4.5
        cantidadResenias: { type: integer, example: 2 }

    TipoEntrada:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: General }
        descripcion: { type: string, example: Campo de pie }
        precio: { type: number, example: 15000 }
        cupo: { type: integer, description: Capacidad total, example: 500 }
        vendidas: { type: integer, example: 2 }
        disponibles: { type: integer, example: 498 }
        agotado: { type: boolean, example: false }

    TipoEntradaInput:
      type: object
      required: [nombre, precio, cupo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 50, example: VIP }
        descripcion: { type: string, maxLength: 200, example: Acceso preferencial }
        precio: { type: number, minimum: 0, example: 50000 }
        cupo: { type: integer, minimum: 1, example: 50 }

    EventoReferencia:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Noche Indie en Obras }
        fecha: { type: string, format: date-time }
        lugar: { type: string, example: Estadio Obras }
        imagen: { type: [string, "null"], example: "https://picsum.photos/seed/indie1/800/450" }

    EventoResumen:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: Noche Indie en Obras }
        categoria: { $ref: "#/components/schemas/Categoria" }
        fecha: { type: string, format: date-time }
        lugar: { type: string, example: Estadio Obras }
        imagen: { type: [string, "null"] }
        precioDesde: { type: number, example: 15000 }
        precioHasta: { type: number, example: 50000 }
        agotado: { type: boolean }
        yaSeRealizo: { type: boolean }
        cancelado: { type: boolean, description: "D-31: los cancelados no aparecen en el catálogo" }
        esFavorito:
          type: boolean
          description: true si el comprador identificado lo tiene en favoritos
        organizador: { $ref: "#/components/schemas/Organizador" }

    EventoDetalle:
      allOf:
        - $ref: "#/components/schemas/EventoResumen"
        - type: object
          properties:
            descripcion: { type: string }
            direccion: { type: string, example: "Av. del Libertador 7395, CABA" }
            motivoCancelacion: { type: [string, "null"] }
            fechaCancelacion: { type: [string, "null"], format: date-time }
            puedeEditarse:
              type: boolean
              description: true si quien consulta es el organizador y el evento sigue vigente (D-31)
            multimedia:
              type: array
              items: { type: string, format: uri }
            tiposEntrada:
              type: array
              items: { $ref: "#/components/schemas/TipoEntrada" }
            ultimasResenias:
              type: array
              description: Últimas 5 reseñas de los eventos del organizador (HU-12)
              items: { $ref: "#/components/schemas/Resenia" }

    EventoInput:
      type: object
      required: [nombre, descripcion, categoriaId, fecha, lugar, direccion, tiposEntrada]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100, example: Recital de Rock Nacional }
        descripcion:
          type: string
          minLength: 10
          maxLength: 2000
          example: Una noche con los grandes clásicos del rock nacional.
        categoriaId: { type: integer, example: 1 }
        fecha:
          type: string
          format: date-time
          description: Debe ser futura
          example: "2027-03-15T21:00:00.000Z"
        lugar: { type: string, minLength: 2, maxLength: 100, example: Estadio Luna Park }
        direccion: { type: string, minLength: 3, maxLength: 200, example: "Av. Madero 420, CABA" }
        multimedia:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          example: ["https://picsum.photos/seed/rock/800/450"]
        tiposEntrada:
          type: array
          minItems: 1
          maxItems: 10
          description: Nombres únicos dentro del evento
          items: { $ref: "#/components/schemas/TipoEntradaInput" }

    VentasEvento:
      type: object
      properties:
        cupoTotal: { type: integer, example: 720 }
        entradasVendidas: { type: integer, example: 3 }
        cantidadCompras: { type: integer, example: 2 }
        comprasPendientes: { type: integer, example: 1 }
        recaudacion:
          type: number
          description: Suma de compras CONFIRMADAS y UTILIZADAS
          example: 30000
        mensajesSinLeer:
          type: integer
          description: Mensajes de los compradores que el organizador todavía no leyó (D-26)
          example: 1

    ReputacionEvento:
      type: object
      properties:
        puntajePromedio: { type: [number, "null"], example: 4.5 }
        cantidadResenias: { type: integer, example: 2 }

    CambioEstado:
      type: object
      properties:
        estado: { $ref: "#/components/schemas/EstadoCompra" }
        quien: { $ref: "#/components/schemas/UsuarioResumen" }
        fechaHora: { type: string, format: date-time }

    Compra:
      type: object
      properties:
        id: { type: integer, example: 1 }
        evento: { $ref: "#/components/schemas/EventoReferencia" }
        comprador: { $ref: "#/components/schemas/UsuarioResumen" }
        tipoEntrada:
          type: object
          properties:
            id: { type: integer, example: 1 }
            nombre: { type: string, example: General }
            precio: { type: number, example: 15000 }
        cantidad: { type: integer, example: 2 }
        total: { type: number, example: 30000 }
        estado: { $ref: "#/components/schemas/EstadoCompra" }
        fechaCompra: { type: string, format: date-time }
        diasRestantes:
          type: [integer, "null"]
          description: Días que faltan para el evento (sólo si está CONFIRMADA; 0 si es hoy)
          example: 20
        cantidadMensajes: { type: integer, example: 3 }
        mensajesSinLeer:
          type: integer
          description: Mensajes de la otra parte que quien consulta todavía no leyó (D-26)
          example: 1
        codigo:
          type: [string, "null"]
          description: Código de la entrada (QR), sólo para el comprador y desde que se paga (D-33)
          example: TK-JUAN-H7Y5
        subtotal: { type: number, description: Precio sin descuento, example: 30000 }
        descuento: { type: number, description: Descuento por cupón (0 si no hubo), example: 6000 }
        cupon:
          type: [object, "null"]
          properties:
            codigo: { type: string, example: INDIE20 }
            descripcion: { type: string, example: 20% de descuento }
        pago:
          type: [object, "null"]
          description: Sólo para el comprador (D-37)
          properties:
            marca: { type: string, example: Visa }
            ultimos4: { type: string, example: "4242" }
        venceEn:
          type: [string, "null"]
          format: date-time
          description: Mientras está PENDIENTE, hasta cuándo se puede pagar (15 min); después pasa a VENCIDA (D-36)
        accionesDisponibles:
          type: array
          description: Acciones que el usuario que consulta puede realizar ahora sobre la compra
          items: { $ref: "#/components/schemas/AccionCompra" }

    CompraDetalle:
      allOf:
        - $ref: "#/components/schemas/Compra"
        - type: object
          properties:
            organizador: { $ref: "#/components/schemas/UsuarioResumen" }
            historial:
              type: array
              items: { $ref: "#/components/schemas/CambioEstado" }

    CompraInput:
      type: object
      required: [eventoId, tipoEntradaId, cantidad]
      properties:
        eventoId: { type: integer, example: 1 }
        tipoEntradaId: { type: integer, example: 2 }
        cantidad:
          type: integer
          minimum: 1
          maximum: 10
          description: Máximo configurable (MAX_ENTRADAS_POR_COMPRA)
          example: 2
        codigoCupon:
          type: string
          description: Cupón de descuento del evento (D-38), sin distinguir mayúsculas
          example: INDIE20

    ComprasDeEvento:
      allOf:
        - $ref: "#/components/schemas/Paginado"
        - type: object
          properties:
            evento: { $ref: "#/components/schemas/EventoReferencia" }
            disponibilidad:
              type: array
              description: Entradas disponibles por tipo
              items: { $ref: "#/components/schemas/TipoEntrada" }
            resumenPorEstado:
              type: object
              description: Cantidad de compras en cada estado
              additionalProperties: { type: integer }
              example: { PENDIENTE: 1, CONFIRMADA: 1, UTILIZADA: 0, CANCELADA: 0, REEMBOLSADA: 0 }
            data:
              type: array
              items: { $ref: "#/components/schemas/Compra" }

    Mensaje:
      type: object
      properties:
        id: { type: integer, example: 1 }
        usuario: { $ref: "#/components/schemas/UsuarioResumen" }
        mensaje: { type: string, example: "Hola! ¿A qué hora abren las puertas?" }
        enviado: { type: string, format: date-time }

    MensajeInput:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          { type: string, minLength: 1, maxLength: 1000, example: "¿Hay estacionamiento cerca?" }

    Resenia:
      type: object
      properties:
        id: { type: integer, example: 1 }
        puntuacion: { type: integer, minimum: 1, maximum: 5, example: 5 }
        detalle: { type: string, example: "Un show hermoso, el sonido impecable." }
        fecha: { type: string, format: date-time }
        comprador: { $ref: "#/components/schemas/UsuarioResumen" }
        evento:
          type: object
          properties:
            id: { type: integer, example: 7 }
            nombre: { type: string, example: Recital Acústico en el Konex }
            fecha: { type: string, format: date-time }

    ReseniaInput:
      type: object
      required: [puntuacion, detalle]
      properties:
        puntuacion: { type: integer, minimum: 1, maximum: 5, example: 5 }
        detalle: { type: string, minLength: 1, maxLength: 1000, example: "Excelente organización." }

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servidor
      responses:
        "200":
          description: Servidor funcionando
          content:
            application/json:
              example: { status: ok }

  # ---------------------------------------------------------------- USUARIOS
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear una cuenta (comprador u organizador)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistroInput" }
      responses:
        "201":
          description: Cuenta creada con la sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión con email y contraseña
      description: |-
        Devuelve un JWT. Si las credenciales no son válidas responde 401 sin indicar si el email existe.
        Después de varios intentos fallidos desde la misma IP responde 429.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/cambiar-password:
    post:
      tags: [Autenticación]
      summary: Cambiar la contraseña (pide la actual)
      security: [{ usuario: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual: { type: string, example: ticketit123 }
                passwordNueva:
                  type: string
                  minLength: 8
                  description: Al menos una letra y un número, distinta de la actual
                  example: nueva4567
      responses:
        "204": { description: Contraseña cambiada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      security: [{ usuario: [] }]
      responses:
        "200":
          description: Usuario actual (incluye su email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioPropio" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /usuario:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: Público. Sirve para elegir con qué usuario operar en el front.
      parameters:
        - in: query
          name: rol
          schema: { $ref: "#/components/schemas/RolUsuario" }
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /usuario/me:
    get:
      tags: [Usuarios]
      summary: Usuario de la sesión actual (igual que /auth/me)
      security: [{ usuario: [] }]
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Usuarios]
      summary: Editar el perfil propio (nombre y apellido)
      security: [{ usuario: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, minLength: 2, maxLength: 50, example: Sofi }
                apellido: { type: string, minLength: 2, maxLength: 50, example: Pérez }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioPropio" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /usuario/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /usuario/me/favoritos:
    get:
      tags: [Usuarios]
      summary: Mis eventos favoritos (comprador)
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Favoritos paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EventoResumen" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /usuario/me/favoritos/{eventoId}:
    post:
      tags: [Usuarios]
      summary: Agregar un evento a favoritos (comprador)
      description: Idempotente — si ya estaba en favoritos no se duplica.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/EventoId" }]
      responses:
        "201":
          description: Evento agregado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventoResumen" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Usuarios]
      summary: Quitar un evento de favoritos (comprador)
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/EventoId" }]
      responses:
        "204": { description: Evento quitado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CATEGORÍAS
  /categoria:
    get:
      tags: [Categorías]
      summary: Listar categorías (HU-02, explorar por categorías)
      responses:
        "200":
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Categoria" }

  /categoria/{id}:
    get:
      tags: [Categorías]
      summary: Obtener una categoría
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Categoría
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- EVENTOS
  /evento:
    get:
      tags: [Eventos]
      summary: Buscar, filtrar y ordenar eventos (HU-02, HU-03)
      description: |-
        Público. Por defecto sólo devuelve eventos que todavía no se realizaron.
        Si se envía el token de un comprador, cada evento indica `esFavorito`.
      security: [{}, { usuario: [] }]
      parameters:
        - in: query
          name: texto
          schema: { type: string }
          description: Busca en nombre, descripción, lugar y categoría (sin distinguir mayúsculas ni acentos)
        - in: query
          name: categoria
          schema: { type: integer }
          description: Id de categoría
        - in: query
          name: precioMin
          schema: { type: number, minimum: 0 }
          description: Algún tipo de entrada con precio ≥ precioMin (Evento.tuPrecioEstaEntre)
        - in: query
          name: precioMax
          schema: { type: number, minimum: 0 }
        - in: query
          name: fechaDesde
          schema: { type: string, format: date-time }
        - in: query
          name: fechaHasta
          schema: { type: string, format: date-time }
        - in: query
          name: incluirPasados
          schema: { type: boolean, default: false }
        - in: query
          name: orden
          schema: { type: string, enum: [fecha, precio, puntaje], default: fecha }
          description: "precio = precio más bajo del evento; puntaje = promedio del organizador (sin reseñas van al final)"
        - in: query
          name: dir
          schema: { type: string, enum: [asc, desc], default: asc }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Eventos paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/EventoResumen" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Eventos]
      summary: Crear un evento con sus tipos de entrada (HU-01)
      description: Sólo organizadores. El organizador del evento es el usuario identificado.
      security: [{ usuario: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventoInput" }
            example:
              nombre: Recital de Rock Nacional
              descripcion: Una noche con los grandes clásicos del rock nacional.
              categoriaId: 1
              fecha: "2027-03-15T21:00:00.000Z"
              lugar: Estadio Luna Park
              direccion: "Av. Madero 420, CABA"
              multimedia: ["https://picsum.photos/seed/rock/800/450"]
              tiposEntrada:
                - { nombre: General, descripcion: Campo, precio: 20000, cupo: 1000 }
                - { nombre: Platea, descripcion: Sentado, precio: 35000, cupo: 300 }
                - { nombre: VIP, descripcion: Acceso preferencial, precio: 60000, cupo: 50 }
      responses:
        "201":
          description: Evento creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventoDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /evento/mios:
    get:
      tags: [Eventos]
      summary: Mis eventos con resumen de ventas (organizador)
      description: Próximos primero (el más cercano antes) y luego los pasados.
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Eventos del organizador
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/EventoResumen"
                            - type: object
                              properties:
                                tiposEntrada:
                                  type: array
                                  items: { $ref: "#/components/schemas/TipoEntrada" }
                                ventas: { $ref: "#/components/schemas/VentasEvento" }
                                resenias: { $ref: "#/components/schemas/ReputacionEvento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /evento/{id}:
    get:
      tags: [Eventos]
      summary: Detalle de un evento
      description: Incluye tipos de entrada con disponibilidad, reputación del organizador y sus últimas reseñas (HU-12).
      security: [{}, { usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventoDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Eventos]
      summary: Editar un evento propio (D-31)
      description: |-
        Sólo el organizador y mientras el evento no se haya realizado ni cancelado. Mismo body que al publicar;
        los tipos de entrada existentes llevan su `id` (los nuevos no). No se puede bajar el cupo por debajo de
        lo vendido ni quitar un tipo con ventas (422). Las compras ya hechas conservan su total.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventoInput"
                - type: object
                  properties:
                    tiposEntrada:
                      type: array
                      items:
                        allOf:
                          - $ref: "#/components/schemas/TipoEntradaInput"
                          - type: object
                            properties:
                              id: { type: integer, description: Id del tipo existente }
      responses:
        "200":
          description: Evento actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventoDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /evento/{id}/calendario.ics:
    get:
      tags: [Eventos]
      summary: El evento en formato iCalendar para agregarlo al calendario (D-43)
      description: Público. Incluye lugar, link al evento, recordatorio 2 horas antes y STATUS:CANCELLED si se canceló.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Archivo .ics
          content:
            text/calendar:
              schema: { type: string, example: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\n…" }
        "404": { $ref: "#/components/responses/NotFound" }

  /evento/{id}/estadisticas:
    get:
      tags: [Eventos]
      summary: Estadísticas del evento para su organizador (D-34)
      description: Totales (ocupación, recaudación, ticket promedio, cancelaciones, asistencia, reseñas), ventas por tipo, compras por estado y entradas pagadas por día (últimos 14 días).
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Estadísticas
          content:
            application/json:
              schema:
                type: object
                properties:
                  evento: { $ref: "#/components/schemas/EventoReferencia" }
                  totales:
                    type: object
                    properties:
                      cupoTotal: { type: integer, example: 720 }
                      entradasVendidas:
                        { type: integer, description: Incluye pendientes de pago, example: 3 }
                      entradasPagadas: { type: integer, example: 2 }
                      recaudacion: { type: number, example: 30000 }
                      ticketPromedio: { type: number, example: 30000 }
                      ocupacion:
                        { type: number, description: Porcentaje del cupo pagado, example: 0.3 }
                      compras: { type: integer, example: 2 }
                      tasaCancelacion: { type: number, description: Porcentaje, example: 0 }
                      entradasUtilizadas: { type: integer, example: 0 }
                      puntajePromedio: { type: [number, "null"] }
                      cantidadResenias: { type: integer }
                  porTipo:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nombre: { type: string }
                        cupo: { type: integer }
                        vendidas: { type: integer }
                        pagadas: { type: integer }
                        recaudacion: { type: number }
                  porEstado:
                    type: object
                    additionalProperties: { type: integer }
                  ventasPorDia:
                    type: array
                    items:
                      type: object
                      properties:
                        fecha: { type: string, example: "2026-10-21" }
                        entradas: { type: integer }
                        recaudacion: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /evento/{id}/cancelar:
    post:
      tags: [Eventos]
      summary: Cancelar un evento propio (D-31)
      description: |-
        Cancela todas las compras activas del evento (las CONFIRMADAS quedan REEMBOLSADAS), libera el cupo y saca
        el evento del catálogo. No se puede cancelar un evento realizado o ya cancelado (422).
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  { type: string, minLength: 5, maxLength: 300, example: Problemas con el lugar }
      responses:
        "200":
          description: Evento cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  evento: { $ref: "#/components/schemas/EventoDetalle" }
                  comprasCanceladas: { type: integer, example: 2 }
                  comprasReembolsadas: { type: integer, example: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  # ---------------------------------------------------------------- COMPRAS
  /compra:
    post:
      tags: [Compras]
      summary: Comprar entradas (HU-04)
      description: |-
        Sólo compradores. Reserva el cupo y la compra queda `PENDIENTE` de pago.
        Falla con 422 si no hay cupo suficiente o el evento ya se realizó.
      security: [{ usuario: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompraInput" }
      responses:
        "201":
          description: Compra creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompraDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /compra/mias:
    get:
      tags: [Compras]
      summary: Mis compras (HU-05)
      description: |-
        Sólo compradores. Cada compra indica su estado y, si está CONFIRMADA, los días que faltan para el evento.
        Orden: próximos eventos primero, luego los pasados.
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/EstadoCompra"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Compras paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Compra" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /compra/{id}:
    get:
      tags: [Compras]
      summary: Detalle de una compra
      description: Accesible para el comprador o el organizador del evento.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Compra
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompraDetalle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /evento/{id}/validar:
    post:
      tags: [Ciclo de vida de la compra]
      summary: Validar una entrada en la puerta con su código QR (D-33)
      description: |-
        El organizador del evento escanea o escribe el código (acepta minúsculas, espacios y sin guiones).
        Si la entrada está CONFIRMADA y es el día del evento, pasa a UTILIZADA.
        Probar como Lucía sobre el evento 6 con el código `TK-JUAN-H7Y5`.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                codigo: { type: string, example: TK-JUAN-H7Y5 }
      responses:
        "200":
          description: Entrada válida, ya marcada como utilizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Compra" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /evento/{id}/compras:
    get:
      tags: [Compras]
      summary: Compras de un evento (HU-06)
      description: Sólo el organizador del evento. Incluye disponibilidad por tipo de entrada y resumen por estado.
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/EstadoCompra"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Compras del evento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprasDeEvento" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CICLO DE VIDA
  /compra/{id}/pagar:
    post:
      tags: [Ciclo de vida de la compra]
      summary: Pagar una compra con tarjeta (pasarela simulada, D-37)
      description: |-
        Sólo el comprador. PENDIENTE → CONFIRMADA. Si la compra es gratis no hace falta tarjeta.
        Tarjetas de prueba: `4242 4242 4242 4242` aprobada · `4000 0000 0000 0002` rechazada por fondos
        insuficientes · `4000 0000 0000 0119` error de procesamiento. Vencimiento futuro (MM/AA), CVV de 3–4 números.
        Sólo se guardan la marca y los últimos 4 dígitos.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tarjeta:
                  type: object
                  required: [numero, titular, vencimiento, cvv]
                  properties:
                    numero: { type: string, example: "4242 4242 4242 4242" }
                    titular: { type: string, example: SOFIA PEREZ }
                    vencimiento: { type: string, example: "12/30" }
                    cvv: { type: string, example: "123" }
      responses:
        "200":
          description: Pago aprobado y compra confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompraDetalle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /compra/{id}/transferir:
    post:
      tags: [Ciclo de vida de la compra]
      summary: Transferir la entrada a otra cuenta de comprador (D-41)
      description: |-
        Sólo el titular, con la compra CONFIRMADA y el evento vigente. La compra pasa al destinatario con un código QR
        nuevo (el anterior deja de servir), el chat empieza de cero y el destinatario recibe una notificación.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: juan@ticketit.com }
      responses:
        "200":
          description: Entrada transferida
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferidaA:
                    type: object
                    properties:
                      nombre: { type: string, example: Juan }
                      apellido: { type: string, example: Rodríguez }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /compra/{id}/utilizar:
    post:
      tags: [Ciclo de vida de la compra]
      summary: Marcar la entrada como utilizada (control de acceso)
      description: Sólo el organizador del evento, a partir del día del evento. CONFIRMADA → UTILIZADA.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Entrada utilizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompraDetalle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /compra/{id}/cancelar:
    post:
      tags: [Ciclo de vida de la compra]
      summary: Cancelar una compra y obtener el reembolso (HU-09, HU-10)
      description: |-
        Sólo el comprador. Permitido si la compra no está UTILIZADA (ni ya cancelada) y el evento no se realizó.
        PENDIENTE → CANCELADA. CONFIRMADA → CANCELADA → REEMBOLSADA (automático). Libera el cupo.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Compra cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompraDetalle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /compra/{id}/historial:
    get:
      tags: [Ciclo de vida de la compra]
      summary: Historial de estados de la compra
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cambios de estado en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CambioEstado" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- MENSAJES
  /compra/{id}/mensajes:
    get:
      tags: [Mensajes]
      summary: Mensajes del chat de la compra (HU-07, HU-08)
      description: Comprador u organizador del evento. Usar `desde` para traer sólo los mensajes nuevos (polling).
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - in: query
          name: desde
          schema: { type: string, format: date-time }
          description: Devuelve sólo los mensajes enviados después de esta fecha
      responses:
        "200":
          description: Mensajes en orden cronológico
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mensaje" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Mensajes]
      summary: Enviar un mensaje en el chat de la compra (HU-07, HU-08)
      description: Comprador u organizador del evento, en cualquier estado de la compra.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensajeInput" }
      responses:
        "201":
          description: Mensaje enviado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mensaje" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /compra/{id}/mensajes/leidos:
    post:
      tags: [Mensajes]
      summary: Marcar como leídos los mensajes del chat (D-26)
      description: |-
        El front lo llama al abrir el chat. Deja `mensajesSinLeer` en 0 para quien lo llama.
        Es un endpoint aparte para que el GET del chat (usado por el sondeo) no modifique datos.
        Probar como Lucía (`lucia@ticketit.com`) sobre la compra 1.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Mensajes marcados como leídos }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CUPONES
  /evento/{id}/cupones:
    get:
      tags: [Cupones]
      summary: Cupones del evento (sólo su organizador)
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Cupones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cupon" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Cupones]
      summary: Crear un cupón para el evento (sólo su organizador)
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuponInput" }
      responses:
        "201":
          description: Cupón creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cupon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /evento/{id}/cupones/validar:
    get:
      tags: [Cupones]
      summary: Vista previa del descuento de un cupón antes de comprar
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { in: query, name: codigo, required: true, schema: { type: string, example: INDIE20 } }
        - { in: query, name: tipoEntradaId, required: true, schema: { type: integer, example: 1 } }
        - { in: query, name: cantidad, required: true, schema: { type: integer, example: 2 } }
      responses:
        "200":
          description: Precio con el descuento
          content:
            application/json:
              schema:
                type: object
                properties:
                  cupon:
                    type: object
                    properties:
                      codigo: { type: string }
                      descripcion: { type: string }
                  subtotal: { type: number, example: 30000 }
                  descuento: { type: number, example: 6000 }
                  total: { type: number, example: 24000 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /evento/{id}/cupones/{cuponId}:
    delete:
      tags: [Cupones]
      summary: Desactivar un cupón (deja de poder usarse; las compras hechas no cambian)
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { in: path, name: cuponId, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Cupón desactivado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cupon" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- LISTA DE ESPERA
  /evento/{id}/espera:
    post:
      tags: [Lista de espera]
      summary: Anotarse en la lista de espera de un tipo de entrada agotado
      description: |-
        Sólo compradores. Cuando se libera cupo (cancelación, reserva vencida, más cupo), se avisa al primero de la
        cola y se le guardan las entradas 30 minutos; si no compra, pasan al siguiente. Orden estricto de llegada.
        El detalle del evento (`GET /evento/{id}`) informa `listaEspera.enEspera` por tipo y `listaEspera.mias`.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoEntradaId]
              properties:
                tipoEntradaId: { type: integer, example: 2 }
                cantidad: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Anotado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InscripcionEspera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /evento/{id}/espera/{tipoEntradaId}:
    delete:
      tags: [Lista de espera]
      summary: Salir de la lista de espera (si tenía prioridad, pasa al siguiente)
      security: [{ usuario: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { in: path, name: tipoEntradaId, required: true, schema: { type: integer } }
      responses:
        "204": { description: Salió de la lista }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- ARCHIVOS
  /archivos/imagenes:
    post:
      tags: [Archivos]
      summary: Subir una imagen para un evento (sólo organizadores)
      description: |-
        JPG, PNG o WebP de hasta 5 MB. El tipo se verifica por el contenido del archivo (no por la extensión).
        Devuelve la URL pública, que se usa en `multimedia` al publicar o editar el evento.
      security: [{ usuario: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen: { type: string, format: binary }
      responses:
        "201":
          description: Imagen guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: "http://localhost:3000/uploads/3f2a…c1.jpg" }
                  tipo: { type: string, example: image/jpeg }
                  bytes: { type: integer, example: 245731 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: La imagen pesa más de 5 MB }

  # ---------------------------------------------------------------- NOTIFICACIONES
  /notificacion:
    get:
      tags: [Notificaciones]
      summary: Notificaciones del usuario (más recientes primero)
      security: [{ usuario: [] }]
      parameters:
        - in: query
          name: estado
          schema: { type: string, enum: [NO_LEIDA, LEIDA] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Notificaciones paginadas y total sin leer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      noLeidas: { type: integer, example: 2 }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Notificacion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notificacion/resumen:
    get:
      tags: [Notificaciones]
      summary: Cantidad sin leer (liviano, para el sondeo de la campana)
      security: [{ usuario: [] }]
      responses:
        "200":
          description: Total sin leer
          content:
            application/json:
              schema:
                type: object
                properties:
                  noLeidas: { type: integer, example: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notificacion/leer-todas:
    post:
      tags: [Notificaciones]
      summary: Marcar todas como leídas
      security: [{ usuario: [] }]
      responses:
        "204": { description: Listo }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notificacion/{id}/leer:
    post:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Notificación actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notificacion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- RESEÑAS
  /evento/{id}/resenias:
    get:
      tags: [Reseñas]
      summary: Reseñas de un evento
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reseñas paginadas (más recientes primero), con el evento y su promedio
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - $ref: "#/components/schemas/ReputacionEvento"
                  - type: object
                    properties:
                      evento:
                        type: object
                        properties:
                          id: { type: integer, example: 7 }
                          nombre: { type: string, example: "Recital Acústico en el Konex" }
                          fecha: { type: string, format: date-time }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Resenia" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Reseñas]
      summary: Reseñar un evento (HU-11)
      description: |-
        Sólo compradores con una compra UTILIZADA en el evento. Una reseña por comprador y evento.
        Probar como Juan (`juan@ticketit.com`) sobre el evento 7.
      security: [{ usuario: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReseniaInput" }
      responses:
        "201":
          description: Reseña creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resenia" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /usuario/{id}/resenias:
    get:
      tags: [Reseñas]
      summary: Reseñas de los eventos de un organizador (HU-12)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reputación del organizador y sus reseñas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - type: object
                    properties:
                      organizador: { $ref: "#/components/schemas/Organizador" }
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Resenia" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- DESARROLLO
  /dev/reset:
    post:
      tags: [Desarrollo]
      summary: Recargar los datos semilla
      description: Borra los datos en memoria y vuelve a cargar los de prueba. No disponible con NODE_ENV=production.
      responses:
        "200":
          description: Datos recargados
          content:
            application/json:
              example:
                {
                  message: Datos semilla recargados,
                  usuarios: 5,
                  categorias: 5,
                  eventos: 9,
                  compras: 13,
                  resenias: 4,
                }
        "403": { $ref: "#/components/responses/Forbidden" }
