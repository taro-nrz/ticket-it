# D-35: integración continua. En cada push y pull request: lint, formato, tests del backend con cobertura,
# E2E + accesibilidad (Playwright + axe) y build de las imágenes Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, formato y tests del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: packages/backend/coverage/lcov-report

  e2e:
    name: E2E y accesibilidad
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: packages/frontend
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: |
            packages/frontend/playwright-report
            packages/frontend/test-results

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/backend/Dockerfile -t ticket-it-backend .
      - run: docker build -f packages/frontend/Dockerfile -t ticket-it-web .
